<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nugget Maths – free maths activities and teacher tools for NZ</title>
<meta name="description" content="Free interactive maths games, practice activities and teacher tools for Years 5–13, organised by NZ Curriculum strand and year level.">
<link rel="icon" href="nugget.png">
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#3b2a1a;--mut:#6f5b48;--btn:#b25a18;--onbtn:#fff;--acc:#b25a18;--soft:#fbe6cf;--line:#ecdcc4}
@media (prefers-color-scheme:dark){:root{--bg:#1f1812;--card:#2a2118;--ink:#f4e8d6;--mut:#c9b8a3;--btn:#f0a05a;--onbtn:#2a1a0c;--acc:#f0a05a;--soft:#3a2b1d;--line:#43352a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:auto;padding:.5rem 1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.25rem;color:var(--ink);text-decoration:none}
.brand img{height:44px}
nav{display:flex;gap:.25rem;flex-wrap:wrap;margin-left:auto}
nav a{padding:.4rem .75rem;border-radius:99px;text-decoration:none;color:var(--ink);font-weight:600}
nav a:hover,nav a[aria-current]{background:var(--soft)}
main{max-width:1100px;margin:auto;padding:1.5rem 1rem 3rem}
h1{font-size:clamp(1.7rem,4vw,2.4rem);line-height:1.2;margin:.2rem 0 .6rem}
h2{margin:2rem 0 .6rem}
.hero{display:flex;align-items:center;gap:2rem;flex-wrap:wrap;background:var(--soft);border-radius:20px;padding:1.5rem 2rem}
.hero img{height:200px}.hero>div{flex:1;min-width:260px}
.search{display:flex;gap:.5rem;margin-top:1rem}
input[type=search],select{font:inherit;padding:.6rem .8rem;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:0}
.btn{font:inherit;font-weight:700;background:var(--btn);color:var(--onbtn);border:0;border-radius:10px;padding:.6rem 1.1rem;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.doors,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.door{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1.2rem;text-decoration:none;color:var(--ink)}
.door:hover{border-color:var(--acc)}.door b{font-size:1.2rem;display:block}.door span{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.35rem}
.card h3{margin:0;font-size:1.1rem}.card p{margin:0}.meta{color:var(--mut);font-size:.9rem}
.tags,.badges{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;padding:.1rem .55rem;border-radius:99px;background:var(--soft)}
.badge{font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:0 .4rem}
.card .btn{margin-top:auto;align-self:flex-start;padding:.3rem .7rem;font-size:.85rem}
.filters{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.filters label{font-size:.9rem}.filters .row{display:flex;gap:.8rem;flex-wrap:wrap;width:100%}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{border:1px solid var(--line);padding:.5rem;text-align:center}th:first-child,td:first-child{text-align:left}
td button{font:inherit;font-weight:700;background:var(--soft);color:var(--ink);border:0;border-radius:8px;padding:.3rem .8rem;cursor:pointer;min-width:2.5rem}
td button:hover{background:var(--btn);color:var(--onbtn)}
.about{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start}.about img{width:min(100%,320px);border-radius:16px}.about>div{flex:1;min-width:260px}
footer{text-align:center;color:var(--mut);padding:1.5rem 1rem;border-top:1px solid var(--line);font-size:.9rem}
</style>
</head>

</div></header>

function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,"");const rows=[];let row=[],f="",q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  const h=rows.shift().map(x=>x.trim()),out=[];
  rows.forEach((r,n)=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||"").trim());if(!o["Title"])return;
    const yf=+o["Year from"],yt=+o["Year to"];
    if(!yf||!yt){console.warn("Skipped row "+(n+2)+" ("+o["Title"]+"): check Year from / Year to");return}
    out.push({id:o["ID (slug)"],t:o["Title"],d:o["Short description"],u:o["URL"],aud:o["Audience"],type:o["Type"],pri:o["Primary strand"],
      oth:(o["Other strands"]||"").split(",").map(x=>x.trim()).filter(Boolean),yf,yt,top:o["Topic keywords"],col:o["Teacher can collect data?"],
      cert:o["Certificate?"],prt:o["Printable / downloadable?"],shr:o["Shareable link / teacher set-up?"],pl:o["Players"]})});
  return out}

function match(a,f){
  const h=[a.t,a.d,a.top,a.pri,a.oth.join(" "),a.type].join(" ").toLowerCase();
  if(!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>h.includes(w)))return false;
  if(f.aud==="Student"&&a.aud==="Teacher tool")return false;
  if(f.aud==="Teacher tool"&&a.aud==="Student")return false;
  if(f.str&&a.pri!==f.str&&!a.oth.includes(f.str))return false;
  if(f.type&&a.type!==f.type)return false;
  if(f.yr){const[x,y]=f.yr.split("-").map(Number);if(!(a.yf<=y&&a.yt>=x))return false}
  return f.feat.every(k=>a[k]==="Yes");
}

  <li>Delete the sheet’s data, and remove the deployment, when you no longer need them.</li></ul>

  <h2>Questions</h2><p>Please <a href="#contact">get in touch</a>. Last updated: October 2026.</p></div>`;
},
contact(){
  const e=["nugget.maths","gmail.com"].join("@");
  return `<h1>Contact</h1><div style="max-width:760px"><p>Questions, feedback, ideas for new activities, or a permission request? I’d love to hear from you.</p>
  <p><a class="btn" href="mailto:${e}">Email ${e}</a></p>
  <p>I’m a classroom teacher, so please allow a few days for a reply.</p></div>`;
},
about(){
  const G=[["📚 Learning","University of Bielefeld, Germany: studied Mathematics and Physics and graduated as a Diplom-Mathematikerin (a German Diplom in Mathematics, equivalent to Level 8 on the NZ Qualifications Framework)."],
  ["🎓 Teacher education","Research assistant in initial teacher education at the University of Münster, and part of the organising committee for the International Conference on Creativity in Mathematics Education."],

  ["🥝 Teaching in Aotearoa","Tutor at Kip McGrath, then teacher aide at Pāpāmoa College. Gained a NZ Graduate Diploma of Teaching (Secondary) in Mathematics, Physics and General Science, and now teach maths at Pāpāmoa College as a fully registered teacher in New Zealand."]];
  return `<h1>About Nugget Maths</h1><div class="about"><img src="nugget-photo.jpg" alt="Nugget, a plush hamster holding a nut"><div>
  <h2 style="margin-top:0">Meet Nugget</h2>
  <p>Nugget is a toy hamster. When I started teaching in New Zealand, I used him to explain adding and subtracting integers by making him hop along the number line.</p>

  <img src="nugget.png" alt="Digital Nugget" style="width:140px;border-radius:0"></div></div>
  <div class="about" style="margin-top:2rem"><img src="ute.jpg" alt="Ute Poelman" onerror="this.remove()"><div>

  <p>I’m a fully registered New Zealand teacher, and I teach maths at Pāpāmoa College. I grew up in Germany, moved to New Zealand, and have been helping people learn maths since I started tutoring at 16 – from school students to future teachers.</p>
  <p>Everything on this site comes from that experience: activities I’ve built, tested with real classes, and improved along the way.</p></div></div>
  <h2>My background</h2><div class="grid">${G.map(([h,p])=>`<article class="card"><h3>${h}</h3><p>${p}</p></article>`).join("")}</div>`;}};

function bind(){
  const g=id=>document.getElementById(id);
  g("q").oninput=e=>{F.q=e.target.value;upd()};
  [["aud","aud"],["yr","yr"],["str","str"],["type","type"]].forEach(([i,k])=>g(i).onchange=e=>{F[k]=e.target.value;upd()});
  document.querySelectorAll("[data-f]").forEach(c=>c.onchange=()=>{F.feat=[...document.querySelectorAll("[data-f]:checked")].map(x=>x.dataset.f);upd()});
  g("clr").onclick=()=>{F=blank();render()};
}
function upd(){const l=D.filter(a=>match(a,F));document.getElementById("count").textContent=`${l.length} of ${D.length} activities`;document.getElementById("list").innerHTML=grid(l)}
function render(){
  const h=location.hash.slice(1)||"home",v=views[h]?h:"home";
  app.innerHTML=views[v]();
  document.querySelectorAll("nav a").forEach(a=>a.toggleAttribute("aria-current",a.getAttribute("href")==="#"+v));
  const hs=document.getElementById("hs");if(hs)hs.onsubmit=e=>{e.preventDefault();F={...blank(),q:document.getElementById("hq").value};location.hash="activities"};
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]");if(c){navigator.clipboard&&navigator.clipboard.writeText(c.dataset.copy);c.textContent="Copied ✓";setTimeout(()=>c.textContent="Copy link",1500);return}
  const t=e.target.closest("[data-pre],[data-str]");if(!t)return;
  F={...blank(),aud:t.dataset.pre||"",str:t.dataset.str||"",yr:t.dataset.yr||""};
  if(location.hash==="#activities")render();else location.hash="activities";
});
addEventListener("hashchange",render);
fetch("catalogue.csv",{cache:"no-cache"}).then(r=>r.ok?r.text():Promise.reject()).then(x=>{const n=parseCSV(x);if(n.length)D=n}).catch(()=>{}).finally(render);
</script>
